<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="视觉设计师 / AI 设计师 / 品牌设计师 — 个人作品集" />
    
    <!-- 预连接到 CDN 和字体域名 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    
    <!-- 预加载首屏关键图片 -->
    <link rel="preload" as="image" href="https://cdn.jsdelivr.net/gh/liufulu1/liufulu1.github.io@main/hero-bg.jpg" />
    
    <!-- 字体加载优化：添加display=swap避免FOIT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    
    <title>STUDIO — 视觉 / AI / 品牌设计</title>
    
    <!-- 内联首屏样式 + 加载骨架屏 -->
    <style>
      html, body { margin: 0; padding: 0; background: #050607; }
      #root { min-height: 100vh; }
      
      /* 噪点叠加层 */
      .noise-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;
        pointer-events: none;
        opacity: 0.03;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      }
      
      /* 首屏加载骨架 - JS 加载前显示 */
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #050607;
        z-index: 9998;
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      
      .boot-loader.hidden {
        opacity: 0;
        visibility: hidden;
      }
      
      .boot-logo {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.3em;
        color: #fff;
        margin-bottom: 32px;
        opacity: 0;
        animation: fadeInUp 0.8s ease forwards;
      }
      
      .boot-bar {
        width: 120px;
        height: 2px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
        opacity: 0;
        animation: fadeInUp 0.8s ease 0.2s forwards;
      }
      
      .boot-bar-inner {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, transparent, #fff, transparent);
        border-radius: 2px;
        animation: bootShine 1.5s ease-in-out infinite;
      }
      
      .boot-text {
        margin-top: 16px;
        font-size: 12px;
        color: rgba(255,255,255,0.4);
        letter-spacing: 0.2em;
        opacity: 0;
        animation: fadeInUp 0.8s ease 0.4s forwards;
      }
      
      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      
      @keyframes bootShine {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
    <script type="module" crossorigin src="/assets/index-cbV3gE5X.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CoryG4Fq.css">
  </head>
  <body>
    <!-- 首屏加载骨架 - JS 加载完会自动隐藏 -->
    <div class="boot-loader" id="bootLoader">
      <div class="boot-logo">STUDIO</div>
      <div class="boot-bar">
        <div class="boot-bar-inner"></div>
      </div>
      <div class="boot-text">LOADING</div>
    </div>
    
    <div id="root"></div>
  </body>
</html>
