<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- DeepSeek 鲸鱼：扁平风格，卷成环形，头朝右下，尾巴在上右 -->

  <!-- 鲸鱼身体外轮廓 -->
  <path
    d="
      M 68 22
      C 64 18 58 18 54 22
      C 48 18 40 20 32 24
      C 22 28 14 36 12 46
      C 10 56 14 66 22 74
      C 30 82 42 86 54 84
      C 62 82 68 78 72 74
      C 68 72 64 70 62 68
      C 66 64 68 60 70 56
      C 72 50 72 44 70 38
      C 74 34 80 30 86 26
      C 84 22 78 22 72 26
      C 70 24 68 22 68 22
      Z
    "
    fill="#4F6BFF"
  />

  <!-- 身体内部镂空（白色月牙形） -->
  <path
    d="
      M 30 40
      C 22 44 18 52 20 60
      C 22 66 28 72 36 76
      C 44 78 52 76 58 72
      C 54 68 50 64 48 60
      C 46 56 46 52 44 48
      C 40 44 36 42 30 40
      Z
    "
    fill="#ffffff"
  />

  <!-- 背鳍 -->
  <path
    d="M 48 18 L 52 12 L 56 18 Z"
    fill="#4F6BFF"
  />

  <!-- 尾鳍上叶 -->
  <path
    d="M 68 22 L 66 14 L 74 18 Z"
    fill="#4F6BFF"
  />

  <!-- 尾鳍下叶 -->
  <path
    d="M 84 26 L 88 20 L 90 28 Z"
    fill="#4F6BFF"
  />

  <!-- 胸鳍 -->
  <path
    d="M 62 72 L 68 76 L 74 72 Q 70 76 62 76 Z"
    fill="#4F6BFF"
  />

  <!-- 眼睛（白色小椭圆 + 蓝色瞳孔） -->
  <ellipse cx="56" cy="52" rx="3" ry="4" fill="#fff"/>
  <circle cx="56" cy="53" r="1.5" fill="#4F6BFF"/>

  <!-- 喷水孔小点 -->
  <circle cx="54" cy="46" r="1.5" fill="#4F6BFF"/>
</svg>
