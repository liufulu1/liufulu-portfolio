<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 顶部水滴：青蓝渐变 -->
    <linearGradient id="dv-top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="40%" stop-color="#00B0FF"/>
      <stop offset="80%" stop-color="#7BD7FF"/>
      <stop offset="100%" stop-color="#D4F2FF"/>
    </linearGradient>
    <!-- 左下水滴：黄绿渐变 -->
    <radialGradient id="dv-left" cx="35%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFFFA0"/>
      <stop offset="40%" stop-color="#F0FF40"/>
      <stop offset="80%" stop-color="#D0E010"/>
      <stop offset="100%" stop-color="#A0C000"/>
    </radialGradient>
    <!-- 右下水滴：粉红渐变 -->
    <radialGradient id="dv-right" cx="65%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#FFE0E8"/>
      <stop offset="40%" stop-color="#FF80A0"/>
      <stop offset="80%" stop-color="#FF4060"/>
      <stop offset="100%" stop-color="#E02030"/>
    </radialGradient>
  </defs>

  <!-- 顶部水滴（尖朝下） -->
  <path
    d="M50 16 C62 16 68 28 68 36 C68 44 62 50 56 56 C53 59 51 62 50 66 C49 62 47 59 44 56 C38 50 32 44 32 36 C32 28 38 16 50 16 Z"
    fill="url(#dv-top)"
  />

  <!-- 左下水滴（尖朝右上） -->
  <path
    d="M20 56 C14 56 10 62 10 68 C10 74 14 80 20 82 C26 84 34 82 40 76 C44 72 48 68 50 64 C46 60 42 58 38 56 C32 54 26 56 20 56 Z"
    fill="url(#dv-left)"
  />

  <!-- 右下水滴（尖朝左上） -->
  <path
    d="M80 56 C86 56 90 62 90 68 C90 74 86 80 80 82 C74 84 66 82 60 76 C56 72 52 68 50 64 C54 60 58 58 62 56 C68 54 74 56 80 56 Z"
    fill="url(#dv-right)"
  />
</svg>
